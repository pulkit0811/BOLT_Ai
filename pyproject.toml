[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bolt-ai"
version = "0.1.0"
description = "A personal desktop AI assistant built with PySide6."
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.7,<7", "openai>=1.0,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

